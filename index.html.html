<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Акбермет Усенова — независимый партнёр InCruises</title>
<meta name="description" content="Акбермет Усенова — Marketing Director, независимый партнёр InCruises. Путешествия, международное сообщество и партнёрское направление.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Marck+Script&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bur:#5e2329;--bur2:#3f1519;--bur3:#2b0d10;--em:#0d5c47;--em2:#08392d;--em3:#04251d;--gold:#d2ad82;--gold2:#e6cba6;--txt:#e9d9cc;--mut:#c7b8ab;--hd:"Forum","Cormorant Garamond",Georgia,"Times New Roman",serif;--bd:"Montserrat",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--sc:"Marck Script","Segoe Script",Georgia,cursive;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(112px + env(safe-area-inset-top,0px))}
@media(min-width:900px){html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}}
*{box-sizing:border-box}
body{margin:0;background:var(--bur2);color:var(--txt);font:400 16px/1.65 var(--bd);overflow-x:hidden}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
.w{max-width:1040px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--hd);font-weight:400;line-height:1.15;margin:0;text-transform:uppercase;letter-spacing:.03em}
h2{font-size:clamp(26px,5.4vw,40px);color:var(--gold2);text-align:center;margin-bottom:26px}
section{padding:54px 0}
.wv{display:block;line-height:0}.wv svg{display:block;width:100%;height:46px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bur2);z-index:60}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bur2);color:var(--txt);border-bottom:1px solid rgba(210,173,130,.35)}
.hb{display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap}
.hb .logo img{height:28px;width:auto}
.lg{display:flex;gap:1px;background:rgba(210,173,130,.16);border-radius:20px;padding:3px;margin-left:auto}
.lg button{background:none;border:0;color:var(--mut);font:700 11px var(--bd);padding:6px 9px;border-radius:16px;cursor:pointer}
.lg button.on{background:var(--gold);color:var(--bur2)}
.wab{background:var(--em);color:var(--gold2);border:1px solid var(--gold);font:700 13px var(--bd);padding:7px 14px;border-radius:20px;white-space:nowrap}
nav{order:5;flex:1 0 100%;display:flex;gap:18px;overflow-x:auto;padding:2px 0 10px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}nav a{white-space:nowrap}nav a:hover{color:var(--gold)}
@media(min-width:900px){nav{order:0;flex:1;justify-content:center;padding:0}.lg{margin-left:0}}
.btn{display:inline-block;background:linear-gradient(180deg,var(--gold2),#c9a27a);color:var(--bur2);font:600 15px var(--bd);padding:15px 30px;border-radius:30px;border:1px solid rgba(230,203,166,.6);box-shadow:0 8px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,235,205,.5);text-align:center}
.btn.o{background:none;border:1.5px solid var(--gold);color:var(--gold2);box-shadow:none}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}.hero .cta{margin-top:0}
.hero{background:radial-gradient(760px 460px at 92% 0,var(--bur) 0,transparent 62%),linear-gradient(160deg,var(--em2),var(--em));padding:36px 0 30px}
.hg{display:grid;gap:26px;align-items:center}
@media(min-width:860px){.hg{grid-template-columns:1.15fr .85fr}}
h1{font-size:clamp(34px,8.2vw,62px);color:var(--gold2)}
.hs{display:block;font:400 clamp(26px,6vw,42px)/1.1 var(--sc);color:var(--gold);text-transform:none;letter-spacing:0;margin:-4px 0 14px 12%;transform:rotate(-3deg)}
.hp{max-width:470px;color:var(--txt);margin:0}
.sig{font:400 26px var(--sc);color:var(--gold);text-align:right;margin-top:-10px}
.arch{border-radius:999px 999px 28px 28px;overflow:hidden;border:4px solid var(--gold);box-shadow:0 20px 44px rgba(0,0,0,.45);max-width:380px;margin:0 auto}
.arch img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 10%}
.aud{background:var(--bur)}
.ag{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}@media(min-width:760px){.ag{grid-template-columns:repeat(3,1fr);gap:16px}}
.ac{background:rgba(43,13,16,.45);border:1px solid rgba(210,173,130,.4);border-radius:22px;padding:16px 14px 18px;text-align:center}
.ic{width:74px;height:74px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(160deg,var(--em),var(--em2));border:2px solid var(--gold);display:grid;place-items:center;font-size:32px}
.ac p{margin:0;font-size:14px;color:var(--txt)}
.on-d{background:var(--em2);color:var(--txt)}.on-e{background:var(--em);color:var(--txt)}
.sg{display:grid;gap:26px;align-items:center}
@media(min-width:860px){.sg{grid-template-columns:1fr 1fr}}
.nm{font-family:var(--hd);text-transform:uppercase;font-size:clamp(40px,10vw,68px);line-height:1;color:var(--gold);letter-spacing:.03em}
.nm i{display:block;font:400 clamp(28px,7vw,44px)/1 var(--sc);color:var(--txt);text-transform:none;letter-spacing:0;margin:-6px 0 0 14%;transform:rotate(-4deg)}
.sg .arch{margin:16px 0 0;max-width:340px}.sg .arch img{aspect-ratio:2/3;object-position:50% 38%}
.bl{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.bl li{position:relative;padding-left:20px;font-size:15px}.bl li::before{content:"";position:absolute;left:0;top:9px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.bl b{color:var(--gold)}
.card{background:var(--bur);color:var(--txt);border:1px solid rgba(210,173,130,.4);border-radius:28px;padding:26px 22px;box-shadow:0 14px 34px rgba(0,0,0,.3);margin-top:34px}
.card h2{margin-bottom:8px}.card .sub{text-align:center;color:var(--mut);margin:0 0 24px}
.sc2{display:grid;gap:20px}@media(min-width:860px){.sc2{grid-template-columns:1fr 1fr;gap:30px}}
.sc2 h3{font-size:20px;color:var(--gold);margin-bottom:8px}.sc2 p{margin:0 0 12px;font-size:15px;color:var(--mut)}
.qt{background:linear-gradient(150deg,var(--em),var(--em2));color:var(--txt);border-radius:20px;padding:20px 22px;border:1px solid rgba(210,173,130,.35)}.qt h3{color:var(--gold)}.qt p{color:var(--txt);margin:0}
.ben{background:var(--bur)}
.bg4{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.bc{background:#3a0b1b;border:1px solid rgba(210,173,130,.4);border-radius:22px;padding:22px}
.bc .ic{margin:0 0 12px;width:60px;height:60px;font-size:26px}.bc h3{font-size:18px;color:var(--gold);margin-bottom:6px}.bc p{margin:0;font-size:14px;color:var(--mut)}
.tiles{display:flex;flex-wrap:wrap;gap:26px 16px;justify-content:center;margin-top:8px}
.tile{flex:1 1 240px;max-width:310px;position:relative;background:linear-gradient(180deg,var(--em),var(--em2));border:1px solid rgba(210,173,130,.4);border-radius:18px;padding:30px 18px 18px;color:var(--txt)}
.tile .lbl{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--bur2);font:700 12px var(--bd);letter-spacing:.08em;text-transform:uppercase;padding:5px 18px;border-radius:8px;white-space:nowrap}
.tile.pop{box-shadow:0 0 0 2px var(--gold)}
.tile ul{margin:0;padding-left:16px;font-size:13px;color:var(--txt)}.tile li{margin-bottom:5px}
.tile p{margin:0;font-size:14px}
.bdg{display:inline-block;background:var(--bur);color:var(--gold2);font:600 11px var(--bd);padding:3px 10px;border-radius:10px;margin-bottom:6px}
.pr2{display:flex;gap:8px;margin:8px 0 12px}.pr2 div{flex:1;background:rgba(4,37,29,.55);border:1px solid rgba(210,173,130,.35);border-radius:12px;padding:8px 6px;text-align:center}.pr2 small{display:block;font:600 10px var(--bd);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.pr2 b{font:400 26px var(--hd);color:var(--gold2)}
.note{font-size:12px;color:var(--mut);text-align:center;margin:20px auto 0;max-width:560px}
.card .cta{justify-content:center}
.faq{background:var(--bur)}
details{background:rgba(43,13,16,.45);border:1px solid rgba(210,173,130,.4);border-radius:16px;margin:0 auto 10px;padding:0 18px;max-width:780px}
summary{cursor:pointer;padding:16px 0;font-weight:600;list-style:none;color:var(--txt)}
summary::after{content:"+";float:right;color:var(--gold);font-size:22px}
details[open] summary::after{content:"–"}details p{margin:0 0 16px;color:var(--mut)}
.ct{background:radial-gradient(700px 360px at 50% 0,rgba(94,35,41,.9) 0,transparent 70%),linear-gradient(170deg,var(--em),var(--em3));color:var(--txt);text-align:center}
.ct .sub{max-width:560px;margin:-10px auto 0;color:var(--mut)}.ct .cta{justify-content:center}
.face{width:116px;height:116px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);margin:0 auto 16px}
.cn{margin-top:16px;color:var(--mut);font-size:14px}
footer{background:var(--bur3);color:#b79a8c;padding:24px 0 38px;text-align:center;font-size:12px}footer p{max-width:700px;margin:6px auto}
</style></head><body>
